<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Hero screenshot placeholder</title>
  <desc id="description">Reserved for a current app screenshot showing connected text, media and interactive nodes on the canvas.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8b949e" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1438" height="808" rx="12" fill="#161b22" stroke="#454e5b" stroke-width="2"/>
  <rect x="24" y="24" width="1392" height="762" rx="8" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
    <text x="720" y="345" fill="#b6c3d2" font-size="18" letter-spacing="3">HERO SCREENSHOT PLACEHOLDER</text>
    <text x="720" y="411" fill="#f0f3f6" font-size="38">Canvas overview</text>
    <text x="720" y="462" fill="#b6c3d2" font-size="22">Current app screenshot to be added</text>
  </g>
</svg>
